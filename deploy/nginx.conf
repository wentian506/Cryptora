# CRYPTORA production nginx: serves SPA, proxies /api to backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API + health → FastAPI backend
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /health { proxy_pass http://backend:8000/health; }
  location = /ready  { proxy_pass http://backend:8000/ready; }
  location = /docs   { proxy_pass http://backend:8000/docs; }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
